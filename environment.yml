name: diamond
channels:
  - conda-forge
dependencies:
  - python>=3.11
  - pyside6>=6.10
  # qt6-main 6.10 links ICU's unsuffixed symbols, which only icu>=78 exports.
  # Pinning an older icu leaves Qt6Core.dll unloadable ("DLL load failed while
  # importing QtCore: The specified procedure could not be found").
  - icu>=78
  # QtMultimedia ships separately from qt6-main; without it the move sound is
  # silently unavailable.
  - qt6-multimedia
  - pytest>=7.4
  - pytorch>=2.5
  - pip
  - pip:
      - trueskill>=0.4.5,<0.5
