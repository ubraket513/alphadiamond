[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diamond-console"
version = "0.1.0"
description = "Diamond native Qt console and AlphaZero training tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
alphazero = [
    "torch>=2.5",
    "trueskill>=0.4.5,<0.5",
]
# Build-time only, and deliberately absent from `build-system.requires`: the
# native self-play backend is optional, and `pip install -e .` must keep
# working on a host with no compiler.  See docs/native_selfplay_phase0.md.
native = [
    "pybind11>=2.12",
]

[project.scripts]
alphadiamond-train = "diamond.alphazero.orchestration.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
exclude = [
    "diamond.app*",
    "diamond.assets*",
    "diamond.qml*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# This codebase raises ValueError subclasses for invalid input by design --
# DeploymentArtifactError, ReplayCompatibilityError and friends are all
# ValueErrors, and callers catch them as such. TRY004 would have every one of
# them become a TypeError, which is a behaviour change dressed as a lint fix.
ignore = ["TRY004"]
