[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diamond-console"
version = "0.1.0"
description = "3-player Diamond tournament/operator console (PySide6 + QML)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
diamond = "diamond.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diamond = [
    "qml/*.qml",
    "qml/Style/*.qml",
    "qml/Style/qmldir",
    "assets/fonts/*.ttf",
    "assets/fonts/OFL.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
