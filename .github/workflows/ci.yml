name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-core:
    name: native-core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Select GCC 14 for C++26
        if: runner.os == 'Linux'
        run: |
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
      - run: tools/native_training.sh cmake --preset native-ci
      - run: tools/native_training.sh cmake --build --preset native-ci --parallel
      - run: tools/native_training.sh ctest --preset native-ci --output-on-failure

  native-sanitizers:
    name: native-sanitizers
    runs-on: ubuntu-latest
    env:
      CC: gcc-14
      CXX: g++-14
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - run: tools/native_training.sh cmake --preset native-asan
      - run: tools/native_training.sh cmake --build --preset native-asan --parallel
      - run: tools/native_training.sh ctest --preset native-asan --output-on-failure
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  native-qt:
    name: native-qt
    runs-on: ubuntu-latest
    env:
      CC: gcc-14
      CXX: g++-14
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          modules: 'qtmultimedia'
          cache: true
      - run: >-
          cmake -S . -B build/native-qt-ci
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          -DDIAMOND_BUILD_QT=ON
      - run: cmake --build build/native-qt-ci --parallel
      - run: ctest --test-dir build/native-qt-ci --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

  native-format:
    name: native-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: git diff --check

  compatibility-core:
    name: core (py3.12)
    needs: native-core
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.native-core.result }}' = success

  compatibility-bridge:
    name: bridge (pybind boundary)
    needs: native-core
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.native-core.result }}' = success

  compatibility-lint:
    name: lint (changed files)
    needs: native-format
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.native-format.result }}' = success
