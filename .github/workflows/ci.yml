name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # The definition of done for the native application: a clean checkout builds
  # and tests the C++ core with no Python interpreter, no pybind11 and no
  # pytest anywhere in the job. CMake is the build system; the Makefile is only
  # a command façade, so CI drives the presets directly.
  native-core:
    name: native-core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset native-ci

      - name: Build
        run: cmake --build --preset native-ci --parallel

      - name: Test
        run: ctest --preset native-ci

  # ASan/UBSan over the same tests. Linux only: the sanitiser flags in the
  # preset are Clang/GCC syntax.
  native-sanitizers:
    name: native-sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset native-asan

      - name: Build
        run: cmake --build --preset native-asan --parallel

      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --preset native-asan

  # The engine, AlphaZero stack and bootstrap priors are pure Python and need
  # neither Qt nor a display, so they run on plain pip across every supported
  # interpreter. Torch is CPU-only here: nothing in this job trains on a GPU.
  core:
    name: core (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (no GUI extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest trueskill
          python -m pip install --no-deps -e .

      - name: Test
        run: pytest -m "not gui" --durations=10

      - name: Confirm the AlphaZero import path stays Qt-free
        run: |
          python - <<'PY'
          import sys
          import diamond.alphazero.bootstrap  # noqa: F401
          import diamond.alphazero.orchestration.production  # noqa: F401
          leaked = sorted(m for m in sys.modules if m.startswith("PySide6"))
          assert not leaked, f"AlphaZero pulled in Qt: {leaked}"
          print("no Qt in the AlphaZero import path")
          PY

  # The native self-play backend is optional, so it gets its own job rather
  # than being folded into `core`: `core` must keep proving the tree builds and
  # tests green with no compiler and no pybind11. This job is the standing Gate
  # A regression -- risk 1 in docs/native_selfplay_phase0.md is two
  # authoritative rule implementations drifting apart, and the committed corpus
  # is the only thing that catches it.
  bridge-parity:
    name: bridge-parity (Gate A-F)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "pybind11>=2.12" setuptools wheel
          # numpy is explicit, not incidental: the callback ABI hands Python a
          # py::array_t view onto the native staging buffer, so numpy is a
          # runtime requirement of the extension itself.  Torch no longer pulls
          # it in, and letting the tests importorskip on it would retire the
          # only gate that proves the backends play the same game.
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps -e .

      - name: Build the extension
        run: python tools/build_native.py

      # Gate D's end-to-end tests skip themselves without torch or the
      # checkpoint. That is right on a developer machine and wrong here, where a
      # skip would quietly retire the only test that proves the native backend
      # plays the same game as the Python one. Same reasoning as the gui job's
      # QtMultimedia check.
      - name: Confirm the Gate D fixtures are present
        run: |
          python - <<'PY'
          import hashlib
          import pathlib

          import numpy  # noqa: F401
          import torch  # noqa: F401

          checkpoint = pathlib.Path("runtime/runs/soo/cpu8h-soo-20260819/latest.pt")
          digest = hashlib.sha256(checkpoint.read_bytes()).hexdigest()
          expected = "1634b901e213b065c107eea734b8c172c14babb1c2565352203961e86ea165af"
          assert digest == expected, f"checkpoint digest {digest}"
          print("torch, numpy and the immutable step-80 checkpoint are present")
          PY

      - name: Gate A-F
        run: pytest tests/native -v --durations=10

  # The shipped application, built and exercised headless. This replaces the
  # old `gui` job: the PySide suite it ran was deleted with the last GUI test
  # (5c499e7), and the Qt application under test now is the native one.
  #
  # Built without the Torch-backed Soo search, which is what the C++ contract
  # test is written to tolerate: `analysisAvailable()` reports the build, not
  # the search.
  native-qt:
    name: native-qt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-declarative-dev qt6-multimedia-dev \
            libgl1-mesa-dev libegl1 libxkbcommon-x11-0 \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-window qml6-module-qtqml-workerscript \
            qml6-module-qtquick-templates \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-libav libpulse0

      # Audio is optional in the application, but Qt Multimedia's GStreamer
      # backend segfaults rather than degrading when it cannot create its
      # elements at all, so the plugins have to be installed even on a
      # runner with no sound device.

      - name: Configure
        run: cmake --preset native-qt

      - name: Build
        run: cmake --build --preset native-qt --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset native-qt

  # Scoped to the files a change actually touches. The tree still carries
  # pre-existing ruff findings; linting everything would make this job red on
  # arrival and train people to ignore it. Widen to `ruff check src tests` once
  # the backlog is cleared.
  lint:
    name: lint (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: python -m pip install ruff

      - name: Ruff (changed Python files)
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          mapfile -t changed < <(
            git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.py'
          )
          if [ ${#changed[@]} -eq 0 ]; then
            echo "no Python files changed"
            exit 0
          fi
          printf '%s\n' "${changed[@]}"
          ruff check "${changed[@]}"
