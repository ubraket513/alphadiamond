name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # The engine, AlphaZero stack and bootstrap priors are pure Python and need
  # neither Qt nor a display, so they run on plain pip across every supported
  # interpreter. Torch is CPU-only here: nothing in this job trains on a GPU.
  core:
    name: core (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (no GUI extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest trueskill
          python -m pip install --no-deps -e .

      - name: Test
        run: pytest -m "not gui" --durations=10

      - name: Confirm the AlphaZero import path stays Qt-free
        run: |
          python - <<'PY'
          import sys
          import diamond.alphazero.bootstrap  # noqa: F401
          import diamond.alphazero.orchestration.production  # noqa: F401
          leaked = sorted(m for m in sys.modules if m.startswith("PySide6"))
          assert not leaked, f"AlphaZero pulled in Qt: {leaked}"
          print("no Qt in the AlphaZero import path")
          PY

  # The native self-play backend is optional, so it gets its own job rather
  # than being folded into `core`: `core` must keep proving the tree builds and
  # tests green with no compiler and no pybind11. This job is the standing Gate
  # A regression -- risk 1 in docs/native_selfplay_phase0.md is two
  # authoritative rule implementations drifting apart, and the committed corpus
  # is the only thing that catches it.
  native:
    name: native (Gate A/B parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "pybind11>=2.12" setuptools wheel
          python -m pip install --no-deps -e .

      - name: Build the extension
        run: python tools/build_native.py

      - name: Gate A/B parity
        run: pytest tests/native -v --durations=10

  # Qt lives in its own job: it needs the system libraries and an offscreen
  # platform plugin, and it is the part most likely to break for reasons that
  # have nothing to do with the engine.
  gui:
    name: gui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libpulse0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest trueskill "PySide6>=6.10" qtawesome
          python -m pip install --no-deps -e .

      # The sound tests skip themselves on a build without QtMultimedia, because
      # audio is optional by design and the app must run without it. That is the
      # right behaviour on a user's machine and the wrong behaviour here, where a
      # skip would quietly retire five tests. So CI asserts the backend is
      # actually present, and fails with the real ImportError if it is not.
      - name: Confirm QtMultimedia is available
        run: |
          python - <<'PY'
          from PySide6.QtMultimedia import QAudioOutput, QMediaPlayer  # noqa: F401
          print("QtMultimedia imported; the sound tests will run, not skip")
          PY

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -m gui --durations=10

  # Scoped to the files a change actually touches. The tree still carries
  # pre-existing ruff findings; linting everything would make this job red on
  # arrival and train people to ignore it. Widen to `ruff check src tests` once
  # the backlog is cleared.
  lint:
    name: lint (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: python -m pip install ruff

      - name: Ruff (changed Python files)
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          mapfile -t changed < <(
            git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.py'
          )
          if [ ${#changed[@]} -eq 0 ]; then
            echo "no Python files changed"
            exit 0
          fi
          printf '%s\n' "${changed[@]}"
          ruff check "${changed[@]}"
