name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-core:
    name: native-core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Select GCC 14 for C++26
        if: runner.os == 'Linux'
        run: |
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
      - run: tools/native_training.sh cmake --preset native-ci
      - run: tools/native_training.sh cmake --build --preset native-ci --parallel
      - run: tools/native_training.sh ctest --preset native-ci --output-on-failure

  native-sanitizers:
    name: native-sanitizers
    runs-on: ubuntu-latest
    env:
      CC: gcc-14
      CXX: g++-14
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - run: tools/native_training.sh cmake --preset native-asan
      - run: tools/native_training.sh cmake --build --preset native-asan --parallel
      - run: tools/native_training.sh ctest --preset native-asan --output-on-failure
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  native-training:
    name: native-training (LibTorch CPU)
    runs-on: ubuntu-latest
    env:
      LIBTORCH_VERSION: 2.7.1
      CC: gcc-14
      CXX: g++-14
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned official LibTorch CPU archive
        run: |
          mkdir -p .deps
          curl --fail --location --retry 3 \
            "https://download.pytorch.org/libtorch/cpu/libtorch-cxx11-abi-shared-with-deps-${LIBTORCH_VERSION}%2Bcpu.zip" \
            --output .deps/libtorch.zip
          unzip -q .deps/libtorch.zip -d .deps
      - name: Configure LibTorch training
        run: >-
          tools/native_training.sh cmake --preset native-training
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/.deps/libtorch"
      - run: tools/native_training.sh cmake --build --preset native-training --parallel
      - run: tools/native_training.sh ctest --preset native-training --output-on-failure --no-tests=error

  native-qt:
    name: native-qt
    runs-on: ubuntu-latest
    env:
      CC: gcc-14
      CXX: g++-14
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          modules: 'qtmultimedia'
          cache: true
      - run: >-
          cmake -S . -B build/native-qt-ci
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          -DDIAMOND_BUILD_QT=ON
      - run: cmake --build build/native-qt-ci --parallel
      - run: ctest --test-dir build/native-qt-ci --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

  native-format:
    name: native-format
    runs-on: ubuntu-24.04
    env:
      CLANG_FORMAT_MAJOR: 18
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check whitespace
        run: git diff --check
      - name: Install pinned clang-format major
        run: |
          formatter="clang-format-$CLANG_FORMAT_MAJOR"
          if ! command -v "$formatter" >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes \
              "$formatter"
          fi
          "$formatter" --version
          "$formatter" --version | grep -Eq 'version 18([.]|$)'
      - name: Check only changed C and C++ lines
        shell: bash
        run: |
          set -euo pipefail
          formatter="clang-format-$CLANG_FORMAT_MAJOR"
          base="$BASE_SHA"
          if test -z "$base" || test "$base" = 0000000000000000000000000000000000000000 \
              || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi
          ranges="$RUNNER_TEMP/clang-format-ranges.tsv"
          git diff --unified=0 --no-color --diff-filter=ACMR "$base" -- \
              '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' \
            | awk '
                /^\+\+\+ b\// { file = substr($0, 7); next }
                /^@@ / {
                    plus = index($0, "+")
                    tail = substr($0, plus + 1)
                    space = index(tail, " ")
                    range = substr(tail, 1, space - 1)
                    comma = index(range, ",")
                    if (comma == 0) { start = range + 0; count = 1 }
                    else {
                        start = substr(range, 1, comma - 1) + 0
                        count = substr(range, comma + 1) + 0
                    }
                    if (count > 0) print file "\t" start "\t" start + count - 1
                }
              ' > "$ranges"
          status=0
          while IFS=$'\t' read -r file start end; do
            "$formatter" --dry-run --Werror --style=file \
              --lines="$start:$end" "$file" || status=1
          done < "$ranges"
          exit "$status"

  compatibility-core:
    name: core (py3.12)
    needs: [native-core, native-training]
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.native-core.result }}' = success && test '${{ needs.native-training.result }}' = success

  compatibility-bridge:
    name: bridge (pybind boundary)
    needs: [native-core, native-training]
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.native-core.result }}' = success && test '${{ needs.native-training.result }}' = success

  compatibility-lint:
    name: lint (changed files)
    needs: [native-format, native-training]
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.native-format.result }}' = success && test '${{ needs.native-training.result }}' = success
